[alembic]
script_location = db/migrations
prepend_sys_path = .
version_path_separator = os

# Migration filenames use Alembic's built-in random 12-hex `rev_id()` slug
# followed by a short human-readable name, e.g.
#     07966a575e9a_projection_tables.py
# NEVER hand-number as 0001/0002/... — two people running `alembic revision`
# at once would collide on the number and force an ugly rebase. Random
# slugs are conflict-free by construction.
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40

sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
