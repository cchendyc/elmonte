# Render Blueprint — API only. Frontend deploys to GitHub Pages.
# Dashboard: New → Blueprint → connect this repo.
services:
  - type: web
    name: elmonte-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && cd backend && alembic upgrade head
    # API rate limiting is in-process (per-worker) — keep a single uvicorn
    # worker (the default). Behind Render's proxy, X-Forwarded-For appends
    # the client IP, which backend/api/main.py trusts for rate limiting.
    startCommand: cd backend && uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ELMONTE_ENV
        value: production
      - key: ELMONTE_ID_SALT
        sync: false
      - key: CORS_ORIGINS
        sync: false
        # Comma-separated browser origins, e.g.:
        # https://YOUR_USER.github.io,https://YOUR_USER.github.io/elmonte
