# Scheduled cleanup of orphaned source snapshots from the database.
# Requires a GitHub Actions secret:
#   DATABASE_URL  — PostgreSQL connection string for the application database
#
# Add it in: repo → Settings → Secrets and variables → Actions → Secrets

name: Cleanup orphaned snapshots

on:
  schedule:
    - cron: "17 3 * * *"   # daily at 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python3 -m pip install -r backend/requirements.txt

      - name: Run snapshot cleanup
        run: cd backend && python3 -m scripts.admin.cleanup_snapshots
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
